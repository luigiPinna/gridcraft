name: probe lambda cap cli
on:
  push:
    branches: [probe/lambda-cap-cli]
  workflow_dispatch:
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: probe
        shell: bash
        env:
          CONFIGS: main-guard:17b9f6ff:1 ours-guard:deec166e:1 raise:6cc8b791:0
        run: |
          cp -r .github/probe-cli "$RUNNER_TEMP/probe-cli"
          rustc --version
          PROBE_DIR="$RUNNER_TEMP/probe-cli" bash "$RUNNER_TEMP/probe-cli/run2.sh"
