name: probe lambda cap cli
on:
  push:
    branches: [probe/lambda-cap-cli]
  workflow_dispatch:
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: tests on the final commit
        shell: bash
        run: |
          git checkout -q 27362d58
          rustc --version
          for flag in "" --release; do
            echo "### calc ${flag:-dev}"; cargo test -q -p gridcraft-calc $flag 2>&1 | grep -E '^test result|FAILED|panicked|error'
          done
          echo "### engine dev"; cargo test -q -p gridcraft-engine 2>&1 | grep -E '^test result|FAILED|panicked|error'
